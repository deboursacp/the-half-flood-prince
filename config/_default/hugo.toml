baseURL                = "https://the-half-flood-prince.com/"
locale                 = "en-us"
title                  = "The Half Flood Prince"
defaultContentLanguage = "en"
hasCJKLanguage         = false
theme                  = "hugo-theme-stack"
enableGitInfo          = true

[frontmatter]
    date    = [":filename", ":default"]
    lastmod = [":git", "lastmod", ":fileModTime", ":default"]

[pagination]
    pagerSize = 10

[permalinks]
    post = "/p/:slug/"
    page = "/:slug/"
