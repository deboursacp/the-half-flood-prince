mainSections   = ["post"]
rssFullContent = true

[footer]
    since = 2026

[sidebar]
    subtitle = "Guides to kiting in the Bay Area"

[article]
    headingAnchor = true
    math          = false
    toc           = true
    readingTime   = true

    [article.license]
        enabled = false

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page = [{ type = "toc" }]

# Comments disabled for now — will add Cloudflare Workers + D1 later
[comments]
    enabled = false

[colorScheme]
    toggle  = true
    default = "auto"

[imageProcessing]
    [imageProcessing.content]
        widths  = [800, 1600, 2400]
        enabled = true

    [imageProcessing.thumbnail]
        enabled = true
